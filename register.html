<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカウント作成 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./auth-choice.html" class="back-btn">＜</a>
      <h1>アカウント作成</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <form onsubmit="event.preventDefault(); window.location.href='./profile-setup.html';">
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" class="form-input" placeholder="メールアドレスを入力する" value="sample@example.com" required>
        </div>
        <div class="form-group">
          <label>パスワード</label>
          <input type="password" class="form-input" placeholder="パスワードを入力する" value="********" required>
        </div>
        <div class="form-group">
          <label>パスワード（確認）</label>
          <input type="password" class="form-input" placeholder="パスワードを再入力してください" value="********" required>
        </div>
        
        <div style="margin: 20px 0; font-size: 12px; color: #666;">
          <input type="checkbox" id="terms" checked required>
          <label for="terms" style="display: inline;">利用規約に同意します。</label>
        </div>

        <button type="submit" class="btn">同意して登録</button>
      </form>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
