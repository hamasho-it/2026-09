<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約確認 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./reserve-time.html" class="back-btn">＜</a>
      <h1>予約する</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <div id="success-alert" class="alert-box" style="display: none;">
        予約が完了しました！！
      </div>

      <div class="card">
        <h3 style="font-size: 15px; margin-bottom: 12px; border-bottom: 1px solid #dddddd; padding-bottom: 6px;">予約内容の最終確認</h3>
        
        <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>選択中のプラン:</strong><br>
            <span id="confirm-plan" style="font-size: 13px; color: #555555;">通常プラン / シアタールーム</span>
          </div>
          <a href="./reserve-plan.html" class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 12px;">変更</a>
        </div>

        <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>予約時間:</strong><br>
            <span id="confirm-time" style="font-size: 13px; color: #555555;">2時間 (10月13日 火)</span>
          </div>
          <a href="./reserve-time.html" class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 12px;">選択画面</a>
        </div>
      </div>

      <button onclick="document.getElementById('success-alert').style.display='block'; setTimeout(() => { window.location.href='./index.html'; }, 1500);" class="btn" style="margin-top: 20px;">この内容で予約する</button>
    </main>

    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">🏠 ホーム</a>
      <a href="./reserve-date.html" class="nav-item active">📅 予約</a>
      <a href="./cart.html" class="nav-item">🛒 カート</a>
      <a href="./mypage.html" class="nav-item">👤 マイページ</a>
    </nav>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selectedTime = localStorage.getItem('rehouse_time') || '2時間';
      document.getElementById('confirm-time').innerText = selectedTime + ' (10月13日 火)';
      if (selectedTime.includes('セット')) {
        document.getElementById('confirm-plan').innerText = 'シアタールーム 2時間プラン (¥2,100)';
      } else {
        document.getElementById('confirm-plan').innerText = '通常フリースペースプラン';
      }
    });
  </script>
  <script src="./script.js"></script>
</body>
</html>
