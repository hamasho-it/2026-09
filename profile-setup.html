<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール登録 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./register.html" class="back-btn">＜</a>
      <h1>プロフィール登録</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="img-placeholder" style="width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 10px auto;">
          <img src="./images/icon-user-default.png" alt="icon-user-default.png" onerror="this.style.display='none'; this.parentNode.innerText='アイコン';">
        </div>
        <span style="font-size: 13px; color: #666666;">プロフィール画像</span>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='./index.html';">
        <div class="form-group">
          <label>ユーザーネーム</label>
          <input type="text" class="form-input" placeholder="名前を入力" value="利用者A" required>
        </div>
        <div class="form-group">
          <label>電話番号</label>
          <input type="tel" class="form-input" placeholder="電話番号を入力" value="000-0000-0000" required>
        </div>

        <button type="submit" class="btn" style="margin-top: 30px;">完了</button>
      </form>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
