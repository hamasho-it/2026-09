<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカウント設定 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./mypage.html" class="back-btn">＜</a>
      <h1>アカウント設定</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <form onsubmit="event.preventDefault(); window.location.href='./mypage.html';">
        <div class="form-group">
          <label>ユーザーネーム</label>
          <input type="text" class="form-input" value="利用者A">
        </div>

        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" class="form-input" value="sample@example.com">
        </div>

        <div class="form-group">
          <label>電話番号</label>
          <input type="tel" class="form-input" value="000-0000-0000">
        </div>

        <div class="form-group">
          <label>パスワード変更</label>
          <input type="password" class="form-input" placeholder="新しいパスワードを入力">
        </div>

        <button type="submit" class="btn" style="margin-top: 24px;">保存 / 更新</button>
      </form>
    </main>

    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">🏠 ホーム</a>
      <a href="./reserve-date.html" class="nav-item">📅 予約</a>
      <a href="./cart.html" class="nav-item">🛒 カート</a>
      <a href="./mypage.html" class="nav-item active">👤 マイページ</a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
