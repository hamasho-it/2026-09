<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約・時間選択 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./reserve-plan.html" class="back-btn">＜</a>
      <h1>予約する</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <p style="font-size: 14px; margin-bottom: 16px; font-weight: bold;">何時間予約しますか？</p>

      <div class="form-group">
        <label id="time-label">利用時間選択（1時間〜5時間）</label>
        <select id="time-select" class="form-input" onchange="localStorage.setItem('rehouse_time', this.value);">
          <option value="1時間">1時間</option>
          <option value="2時間" selected>2時間</option>
          <option value="3時間">3時間</option>
          <option value="4時間">4時間</option>
          <option value="5時間">5時間</option>
        </select>
      </div>

      <p id="plan-note" style="font-size: 12px; color: #666666; margin-bottom: 20px; display: none;">
        ※セットプラン（シアタールーム）は2時間固定となります。
      </p>

      <div style="margin-top: 30px;">
        <a href="./reserve-confirm.html" class="btn">次へ</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">🏠 ホーム</a>
      <a href="./reserve-date.html" class="nav-item active">📅 予約</a>
      <a href="./cart.html" class="nav-item">🛒 カート</a>
      <a href="./mypage.html" class="nav-item">👤 マイページ</a>
    </nav>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const select = document.getElementById('time-select');
    if (urlParams.get('plan') === 'set') {
      select.value = '2時間';
      select.disabled = true;
      document.getElementById('plan-note').style.display = 'block';
      localStorage.setItem('rehouse_time', '2時間 (シアタールームセット)');
    } else {
      localStorage.setItem('rehouse_time', select.value);
    }
  </script>
  <script src="./script.js"></script>
</body>
</html>
