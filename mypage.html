<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./index.html" class="back-btn">＜</a>
      <h1>マイページ</h1>
      <a href="./settings.html" style="text-decoration: none; color: #333; font-size: 18px; font-weight: bold;">＞</a>
    </header>

    <main class="app-content">
      <!-- ユーザー情報 -->
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
        <div class="img-placeholder" style="width: 50px; height: 50px; border-radius: 50%; margin-bottom: 0;">
          <img src="./images/icon-user-default.png" alt="icon-user-default.png" onerror="this.style.display='none'; this.parentNode.innerText='アイコン';">
        </div>
        <div>
          <h2 style="font-size: 16px;">利用者A さん</h2>
          <p style="font-size: 12px; color: #666;">いつもご利用ありがとうございます。</p>
        </div>
      </div>

      <!-- スタンプカード -->
      <div class="card" style="text-align: center;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 13px; font-weight: bold;">スタンプカード</span>
          <span style="font-size: 12px; color: #666;">7 / 10回</span>
        </div>
        <div class="img-placeholder" style="height: 100px;">
          <img src="./images/stamp-card.png" alt="stamp-card.png" onerror="this.style.display='none'; this.parentNode.innerText='[ stamp-card.png ] スタンプ 7/10 達成';">
        </div>
        <p style="font-size: 11px; color: #333; margin-top: 6px;">10回達成で... ジュース1本 or お菓子1個 <strong>無料</strong></p>
      </div>

      <!-- 履歴タブ -->
      <div style="margin-top: 16px;">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 10px;">
          <span style="font-weight: bold; font-size: 13px;">予約・購入履歴</span>
          <span style="font-size: 12px; color: #666;">すべて ∨</span>
        </div>

        <div class="product-item" style="padding: 8px 0;">
          <div class="product-info">
            <div class="product-name">カップヌードル、他</div>
            <div class="product-price">2026/10/10 14:00</div>
          </div>
          <span style="font-size: 12px; color: #666;">購入完了</span>
        </div>

        <div class="product-item" style="padding: 8px 0;">
          <div class="product-info">
            <div class="product-name">コカ・コーラ</div>
            <div class="product-price">2026/10/05 16:30</div>
          </div>
          <span style="font-size: 12px; color: #666;">購入完了</span>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">🏠 ホーム</a>
      <a href="./reserve-date.html" class="nav-item">📅 予約</a>
      <a href="./cart.html" class="nav-item">🛒 カート</a>
      <a href="./mypage.html" class="nav-item active">👤 マイページ</a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
