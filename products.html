<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品選択 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./index.html" class="back-btn">＜</a>
      <h1>購入商品</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <div id="toast-msg" class="alert-box" style="display: none; position: sticky; top: 10px; z-index: 10;"></div>

      <div class="category-tabs">
        <a href="#section-noodle" class="tab-btn active">カップラーメン</a>
        <a href="#section-drink" class="tab-btn">飲み物</a>
        <a href="#section-snack" class="tab-btn">お菓子</a>
      </div>

      <h3 id="section-noodle" style="font-size: 14px; margin: 12px 0 6px 0; padding-bottom: 4px; border-bottom: 2px solid #333;">カップラーメン</h3>
      <div class="product-item">
        <div class="product-img"><img src="./images/item-noodle.png" alt="item-noodle" onerror="this.style.display='none'; this.parentNode.innerText='ラーメン';"></div>
        <div class="product-info"><div class="product-name">カップヌードル</div><div class="product-price">¥150</div></div>
        <button onclick="addToCart('カップヌードル', 150)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div class="product-item">
        <div class="product-img"><img src="./images/item-noodle.png" alt="item-noodle" onerror="this.style.display='none'; this.parentNode.innerText='ラーメン';"></div>
        <div class="product-info"><div class="product-name">辛ラーメン</div><div class="product-price">¥100</div></div>
        <button onclick="addToCart('辛ラーメン', 100)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div class="product-item">
        <div class="product-img"><img src="./images/item-noodle.png" alt="item-noodle" onerror="this.style.display='none'; this.parentNode.innerText='ラーメン';"></div>
        <div class="product-info"><div class="product-name">豚骨タンメン 中華</div><div class="product-price">¥150</div></div>
        <button onclick="addToCart('豚骨タンメン 中華', 150)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <h3 id="section-drink" style="font-size: 14px; margin: 20px 0 6px 0; padding-bottom: 4px; border-bottom: 2px solid #333;">飲み物</h3>
      <div class="product-item">
        <div class="product-img"><img src="./images/item-drink.png" alt="item-drink" onerror="this.style.display='none'; this.parentNode.innerText='ドリンク';"></div>
        <div class="product-info"><div class="product-name">三ツ矢サイダー</div><div class="product-price">¥100</div></div>
        <button onclick="addToCart('三ツ矢サイダー', 100)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div class="product-item">
        <div class="product-img"><img src="./images/item-drink.png" alt="item-drink" onerror="this.style.display='none'; this.parentNode.innerText='ドリンク';"></div>
        <div class="product-info"><div class="product-name">ファンタグレープ</div><div class="product-price">¥100</div></div>
        <button onclick="addToCart('ファンタグレープ', 100)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div class="product-item">
        <div class="product-img"><img src="./images/item-drink.png" alt="item-drink" onerror="this.style.display='none'; this.parentNode.innerText='ドリンク';"></div>
        <div class="product-info"><div class="product-name">カルピスウォーター</div><div class="product-price">¥100</div></div>
        <button onclick="addToCart('カルピスウォーター', 100)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div class="product-item">
        <div class="product-img"><img src="./images/item-drink.png" alt="item-drink" onerror="this.style.display='none'; this.parentNode.innerText='ドリンク';"></div>
        <div class="product-info"><div class="product-name">コカ・コーラ</div><div class="product-price">¥100</div></div>
        <button onclick="addToCart('コカ・コーラ', 100)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <h3 id="section-snack" style="font-size: 14px; margin: 20px 0 6px 0; padding-bottom: 4px; border-bottom: 2px solid #333;">お菓子</h3>
      <div class="product-item">
        <div class="product-img"><img src="./images/item-snack.png" alt="item-snack" onerror="this.style.display='none'; this.parentNode.innerText='お菓子';"></div>
        <div class="product-info"><div class="product-name">ホイフル</div><div class="product-price">¥150</div></div>
        <button onclick="addToCart('ホイフル', 150)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div class="product-item">
        <div class="product-img"><img src="./images/item-snack.png" alt="item-snack" onerror="this.style.display='none'; this.parentNode.innerText='お菓子';"></div>
        <div class="product-info"><div class="product-name">ポテトチップス うすしお</div><div class="product-price">¥120</div></div>
        <button onclick="addToCart('ポテトチップス うすしお', 120)" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">カートへ</button>
      </div>

      <div style="margin-top: 30px;">
        <a href="./cart.html" class="btn">お支払い画面へ</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">🏠 ホーム</a>
      <a href="./reserve-date.html" class="nav-item">📅 予約</a>
      <a href="./cart.html" class="nav-item active">🛒 カート</a>
      <a href="./mypage.html" class="nav-item">👤 マイページ</a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
