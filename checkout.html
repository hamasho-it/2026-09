<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購入画面 - リハウス</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./cart.html" class="back-btn">＜</a>
      <h1>購入画面</h1>
      <div class="header-placeholder"></div>
    </header>

    <main class="app-content">
      <div id="order-complete-msg" class="alert-box" style="display: none;">
        注文内容が確定しました！<br>ご利用ありがとうございます。
      </div>

      <div class="card">
        <h3 style="font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid #dddddd; padding-bottom: 4px;">注文内容の一覧</h3>
        
        <div id="cart-items-list">
          <!-- JSで選択商品と連動 -->
        </div>

        <div style="margin-top: 12px; text-align: right; font-weight: bold; font-size: 16px;">
          合計金額: <span id="cart-total-price">¥400</span>
        </div>
      </div>

      <div id="step-pay">
        <button onclick="showConfirmStep()" class="btn" style="margin-top: 20px;">お支払いをする</button>
      </div>

      <div id="step-confirm" style="display: none;">
        <button onclick="completeOrder()" class="btn" style="margin-top: 20px; background-color: #2e7d32;">支払いを確定する</button>
      </div>

      <div id="step-done" style="display: none; margin-top: 20px;">
        <a href="./index.html" class="btn btn-outline">戻る</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">🏠 ホーム</a>
      <a href="./reserve-date.html" class="nav-item">📅 予約</a>
      <a href="./cart.html" class="nav-item active">🛒 カート</a>
      <a href="./mypage.html" class="nav-item">👤 マイページ</a>
    </nav>
  </div>

  <script>
    function showConfirmStep() {
      document.getElementById('step-pay').style.display = 'none';
      document.getElementById('step-confirm').style.display = 'block';
    }

    function completeOrder() {
      document.getElementById('step-confirm').style.display = 'none';
      document.getElementById('order-complete-msg').style.display = 'block';
      document.getElementById('step-done').style.display = 'block';
      localStorage.removeItem('rehouse_cart');
    }
  </script>
  <script src="./script.js"></script>
</body>
</html>
